<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Snake - McLovin 100Hz Edition</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #2a3439;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      background-color: #4a752c;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 20px;
      font-size: 1.3rem;
      font-weight: bold;
      user-select: none;
    }

    .score-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #score-icon {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      object-fit: cover;
    }

    canvas {
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .card {
      background: #4a752c;
      padding: 25px 35px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin: 0 0 10px 0;
      font-size: 2rem;
    }

    .card p {
      margin: 0 0 20px 0;
      color: #e0e0e0;
    }

    .restart-btn {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .restart-btn:hover {
      background-color: #0d47a1;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-bar">
      <div class="score-item">
        <img src="McLovin.png" alt="McLovin" id="score-icon"> 
        <span id="score">0</span>
      </div>
      <div class="score-item">
        🏆 <span id="highScore">0</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="544" height="480"></canvas>

    <div id="gameOverOverlay" class="overlay">
      <div class="card">
        <h2>¡Partida Finalizada!</h2>
        <p>McLovins comidos: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="resetGame()">Volver a Jugar</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('highScore');
    const finalScoreElement = document.getElementById('finalScore');
    const overlay = document.getElementById('gameOverOverlay');

    const cols = 17;
    const rows = 15;
    const tileSize = canvas.width / cols;

    // Cargar imagen de comida
    const foodImg = new Image();
    foodImg.src = 'McLovin.png';

    // Estado del juego
    let snake = [];
    let prevSnake = [];
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = localStorage.getItem('google_snake_mclovin_100hz_high') || 0;
    let gameOver = false;

    // Control de tiempo para alta tasa de refresco (100Hz / 120Hz)
    let lastTimeStamp = 0;
    let moveAccumulator = 0;
    const moveStepTime = 110; // Milisegundos entre cada paso lógico de casilla

    highScoreElement.textContent = highScore;

    function initGame() {
      snake = [
        { x: 5, y: 7 },
        { x: 4, y: 7 },
        { x: 3, y: 7 }
      ];
      prevSnake = JSON.parse(JSON.stringify(snake));
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreElement.textContent = score;
      gameOver = false;
      moveAccumulator = 0;
      lastTimeStamp = performance.now();
      overlay.classList.remove('active');
      generateFood();
      requestAnimationFrame(gameLoop);
    }

    // Bucle principal a tasa de refresco nativa (60Hz / 100Hz / 144Hz)
    function gameLoop(currentTimeStamp) {
      if (gameOver) return;

      const deltaTime = currentTimeStamp - lastTimeStamp;
      lastTimeStamp = currentTimeStamp;
      moveAccumulator += deltaTime;

      // Avanzar casillas lógicas cuando se cumpla el intervalo
      while (moveAccumulator >= moveStepTime) {
        dx = nextDx;
        dy = nextDy;
        
        prevSnake = JSON.parse(JSON.stringify(snake));
        moveSnakeLogic();

        if (checkCollision()) {
          endGame();
          return;
        }

        moveAccumulator -= moveStepTime;
      }

      // Factor de interpolación (de 0.0 a 1.0) para un renderizado ultrasuave
      const progress = Math.min(moveAccumulator / moveStepTime, 1.0);

      // Renderizado a alta frecuencia
      drawBoard();
      drawFood();
      drawSnakeSmooth(progress);

      requestAnimationFrame(gameLoop);
    }

    function drawBoard() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#a2d149' : '#aad751';
          ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
        }
      }
    }

    function drawFood() {
      const px = food.x * tileSize;
      const py = food.y * tileSize;

      if (foodImg.complete && foodImg.naturalWidth !== 0) {
        const margin = 2;
        ctx.drawImage(
          foodImg, 
          px + margin, 
          py + margin, 
          tileSize - margin * 2, 
          tileSize - margin * 2
        );
      } else {
        ctx.fillStyle = '#ff9800';
        ctx.fillRect(px + 2, py + 2, tileSize - 4, tileSize - 4);
      }
    }

    // Dibujo fluido con interpolación suave
    function drawSnakeSmooth(progress) {
      if (snake.length === 0) return;

      // Función auxiliar de interpolación lineal
      const lerp = (start, end, t) => start + (end - start) * t;

      // Calcular posiciones intermedias
      const interpolatedPoints = snake.map((part, index) => {
        const prevPart = prevSnake[index] || part;
        return {
          x: lerp(prevPart.x, part.x, progress) * tileSize + tileSize / 2,
          y: lerp(prevPart.y, part.y, progress) * tileSize + tileSize / 2
        };
      });

      // 1. DIBUJAR EL CUERPO CONTINUO
      ctx.strokeStyle = '#4674e9';
      ctx.lineWidth = tileSize * 0.82;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      interpolatedPoints.forEach((point, index) => {
        if (index === 0) {
          ctx.moveTo(point.x, point.y);
        } else {
          ctx.lineTo(point.x, point.y);
        }
      });
      ctx.stroke();

      // 2. DIBUJAR OJOS EN LA CABEZA FLUIDA
      const head = interpolatedPoints[0];
      const eyeRadius = tileSize * 0.14;
      const pupilRadius = tileSize * 0.07;
      const eyeOffsetForward = tileSize * 0.16;
      const eyeOffsetSide = tileSize * 0.20;

      let eye1X, eye1Y, eye2X, eye2Y;
      let pupilDx = 0, pupilDy = 0;

      if (dx === 1) { // Derecha
        eye1X = head.x + eyeOffsetForward; eye1Y = head.y - eyeOffsetSide;
        eye2X = head.x + eyeOffsetForward; eye2Y = head.y + eyeOffsetSide;
        pupilDx = 1.5;
      } else if (dx === -1) { // Izquierda
        eye1X = head.x - eyeOffsetForward; eye1Y = head.y - eyeOffsetSide;
        eye2X = head.x - eyeOffsetForward; eye2Y = head.y + eyeOffsetSide;
        pupilDx = -1.5;
      } else if (dy === -1) { // Arriba
        eye1X = head.x - eyeOffsetSide; eye1Y = head.y - eyeOffsetForward;
        eye2X = head.x + eyeOffsetSide; eye2Y = head.y - eyeOffsetForward;
        pupilDy = -1.5;
      } else if (dy === 1) { // Abajo
        eye1X = head.x - eyeOffsetSide; eye1Y = head.y + eyeOffsetForward;
        eye2X = head.x + eyeOffsetSide; eye2Y = head.y + eyeOffsetForward;
        pupilDy = 1.5;
      }

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(eye1X, eye1Y, eyeRadius, 0, Math.PI * 2);
      ctx.arc(eye2X, eye2Y, eyeRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(eye1X + pupilDx, eye1Y + pupilDy, pupilRadius, 0, Math.PI * 2);
      ctx.arc(eye2X + pupilDx, eye2Y + pupilDy, pupilRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    function moveSnakeLogic() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreElement.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreElement.textContent = highScore;
          localStorage.setItem('google_snake_mclovin_100hz_high', highScore);
        }
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * cols);
      food.y = Math.floor(Math.random() * rows);

      for (let part of snake) {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
          break;
        }
      }
    }

    function checkCollision() {
      const head = snake[0];

      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
        return true;
      }

      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return true;
        }
      }
      return false;
    }

    function endGame() {
      gameOver = true;
      finalScoreElement.textContent = score;
      overlay.classList.add('active');
    }

    function resetGame() {
      initGame();
    }

    document.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (gameOver && e.key === ' ') {
        resetGame();
        return;
      }

      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dx === 0) {
        nextDx = -1; nextDy = 0;
      } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dy === 0) {
        nextDx = 0; nextDy = -1;
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dx === 0) {
        nextDx = 1; nextDy = 0;
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dy === 0) {
        nextDx = 0; nextDy = 1;
      }
    });

    initGame();
  </script>
</body>
</html>
